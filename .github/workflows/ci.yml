name: CI

# CI runs what you run locally, except the type-check and `herdr-app check`:
# both need the Herdr app installed (see docs/types.md). The pre-commit hook
# runs the full `vp check` locally.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Format and lint
        run: vp check
      - name: Test
        run: vp run -r test
      - name: Build
        run: vp run -r build
      - name: mods/ matches the source
        run: |
          if [ -n "$(git status --porcelain -- mods/)" ]; then
            git status --short -- mods/
            echo "::error::mods/ is out of date. Run 'vp run -r build' and commit the result."
            exit 1
          fi
