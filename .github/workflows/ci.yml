name: CI

# CI runs `vp run verify`, the same script the local Stop hook runs, then the
# build. Two things run only locally: the type-check with the type-aware lint
# rules (vite.config.ts turns both off when CI is set) and `herdr-app check`.
# Both need the Herdr app installed (see docs/types.md).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - name: Verify (format, lint, test, config audit)
        run: vp run verify
      - name: Build
        run: vp run -r build
      - name: mods/ matches the source
        run: |
          if [ -n "$(git status --porcelain -- mods/)" ]; then
            git status --short -- mods/
            echo "::error::mods/ is out of date. Run 'vp run -r build' and commit the result."
            exit 1
          fi
