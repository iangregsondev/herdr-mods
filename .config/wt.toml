# Worktrunk project config: https://worktrunk.dev/hook/

# A new worktree gets the main checkout's dev target (herdr-dev.json is git-ignored, so git
# doesn't bring it), so the dev loop there reaches the same Herdr host. pre-start, not
# post-start, so the file is in place before anything runs in the worktree.
[pre-start]
herdr-dev-config = "sh scripts/copy-dev-config.sh {{ primary_worktree_path }} {{ worktree_path }}"
